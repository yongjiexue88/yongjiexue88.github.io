name: Publish Pages redirect

# The site is hosted on Vercel at https://www.yongjiexue.io — this workflow does
# not build or deploy it.
#
# It exists only because GitHub will not let Pages be disabled on a user site
# (<user>.github.io): the REST API answers "Deactivating GitHub pages for this
# repository is not allowed." Building the real site here instead produced a
# second, self-canonicalising copy on yongjiexue88.github.io that competed with
# the live site in search — and would go stale the moment this workflow stopped.
#
# So Pages is given the smallest harmless thing to serve: the path-preserving
# redirect in pages-redirect/. No Hugo, no content, no 1.1 GB artifact.
#
# If the canonical domain changes, update pages-redirect/404.html (and its
# index.html copy) along with `baseURL` in hugo.yaml.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload redirect as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages-redirect

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
