<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>Yongjie Xue — moved to yongjiexue88-github-io.vercel.app</title>

        <!--
            This repository is a GitHub user site (<user>.github.io), and GitHub
            does not allow Pages to be switched off for one — the REST API answers
            "Deactivating GitHub pages for this repository is not allowed."

            So Pages cannot be removed; it can only be given something harmless to
            serve. Left alone it kept serving a frozen copy of the app that
            canonicalised to itself, which would have competed with the live
            Vercel site in search and drifted staler with every commit.

            This page is that harmless thing. The canonical tag hands search
            engines to Vercel, and the script forwards visitors to the same path
            they asked for, so existing deep links keep working.
        -->
        <link rel="canonical" href="https://yongjiexue88-github-io.vercel.app/"/>
        <meta name="robots" content="noindex, follow"/>
        <meta http-equiv="refresh" content="0; url=https://yongjiexue88-github-io.vercel.app/"/>

        <script type="text/javascript">
            // Path-preserving forward, so /notes/some-slug lands on /notes/some-slug
            // rather than the home page. Runs before the meta refresh in practice.
            (function (l) {
                var target = "https://yongjiexue88-github-io.vercel.app";
                l.replace(target + l.pathname + l.search + l.hash);
            }(window.location))
        </script>

        <style>
            body {
                background: #f7f9fb;
                color: #04060a;
                font: 400 15px/1.65 ui-sans-serif, system-ui, -apple-system, sans-serif;
                letter-spacing: -0.006em;
                margin: 0;
                padding: 64px 32px;
            }
            a { color: #0d7dd4; }
        </style>
    </head>
    <body>
        <p>This site has moved to
            <a href="https://yongjiexue88-github-io.vercel.app/">yongjiexue88-github-io.vercel.app</a>.
        </p>
    </body>
</html>
