<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved to yongjiexue.io</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.yongjiexue.io/">
<!--
  GitHub Pages cannot be switched off for a <user>.github.io repository, so this
  redirect is the smallest harmless thing it can serve. The site itself lives on
  Vercel at www.yongjiexue.io.

  Pages serves 404.html for every unknown path, which is every path here, so this
  file carries the path-preserving redirect. index.html is the same file for "/".
-->
<script>
  (function () {
    var target = "https://www.yongjiexue.io" +
      window.location.pathname + window.location.search + window.location.hash;
    window.location.replace(target);
  })();
</script>
<meta http-equiv="refresh" content="1; url=https://www.yongjiexue.io/">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
         color: #1b1a18; background: #fffdf8; }
  main { max-width: 32rem; padding: 2rem; text-align: center; }
  a { color: #6e1b1b; }
</style>
</head>
<body>
<main>
  <h1>This site has moved</h1>
  <p>You are being redirected to <a href="https://www.yongjiexue.io/">www.yongjiexue.io</a>.</p>
</main>
</body>
</html>
