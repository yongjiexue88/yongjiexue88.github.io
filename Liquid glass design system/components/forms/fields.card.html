<!-- @dsCard group="Components" viewport="700x230" name="Fields" subtitle="Input, Select, Textarea — glass and solid, with hint and error" -->
<!DOCTYPE html>
<html lang="en" data-lg-theme="dark">
<head>
<meta charset="utf-8" />
<title>Fields</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../dev-loader.js"></script>
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 230px; box-sizing: border-box; padding: 22px;
    background-color: var(--lg-neutral-950);
    background-image: radial-gradient(60% 60% at 80% 12%, oklch(0.66 0.16 170 / 0.85) 0%, transparent 72%), radial-gradient(55% 55% at 16% 64%, oklch(0.52 0.14 210 / 0.75) 0%, transparent 72%), radial-gradient(55% 55% at 58% 98%, oklch(0.60 0.13 140 / 0.6) 0%, transparent 72%), linear-gradient(140deg, oklch(0.44 0.12 175) 0%, oklch(0.27 0.09 212) 100%);
    color: var(--lg-text-primary);
    font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .cap { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: rgba(255,255,255,0.5); }
</style>
<style>@keyframes lg-spin { to { transform: rotate(360deg); } }</style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;gap:10px;padding:28px;font:var(--lg-type-mono);color:var(--lg-text-tertiary)"><span style="width:12px;height:12px;border-radius:999px;border:2px solid currentColor;border-top-color:transparent;animation:lg-spin 0.8s linear infinite"></span>Compiling Liquidglass — first load only</div></div>
<script type="text/lg-jsx" id="demo-src">
const { Input, Select, Textarea, Icon } = L;
  function Demo() {
    return (
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 18, alignItems: 'start' }}>
        <Input label="Email" placeholder="you@domain.com" hint="Used for new chapters only." iconLeft={<Icon name="mail" size={16} />} />
        <Input label="Slug" variant="solid" value="on-refraction" error="Already taken" />
        <Select label="Format" placeholder="Choose one" options={[{ value: 'epub', label: 'EPUB' }, { value: 'pdf', label: 'PDF' }]} />
        <Textarea label="Note" variant="solid" rows={2} placeholder="Anything you want remembered." />
      </div>
    );
  }
</script>
<script>
(function () {
  var root = document.getElementById('root');
  function fail(e) {
    root.innerHTML = '<pre style="color:#fff;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap">' + String((e && e.stack) || e) + '</pre>';
  }
  window.LiquidglassDev.ready.then(function (L) {
    var src = document.getElementById('demo-src').textContent;
    var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
    new Function('L', 'React', 'ReactDOM', out + '\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Demo));')(L, window.React, window.ReactDOM);
  }).catch(fail);
}());
</script>
</body>
</html>
