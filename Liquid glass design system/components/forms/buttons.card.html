<!-- @dsCard group="Components" viewport="700x200" name="Buttons" subtitle="Button variants and sizes, IconButton, disabled" -->
<!DOCTYPE html>
<html lang="en" data-lg-theme="dark">
<head>
<meta charset="utf-8" />
<title>Buttons</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../dev-loader.js"></script>
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 200px; box-sizing: border-box; padding: 22px;
    background-color: var(--lg-neutral-950);
    background-image: radial-gradient(60% 60% at 68% 8%, oklch(0.62 0.19 250 / 0.9) 0%, transparent 72%), radial-gradient(55% 55% at 10% 86%, oklch(0.52 0.17 285 / 0.8) 0%, transparent 72%), radial-gradient(55% 55% at 92% 88%, oklch(0.58 0.15 200 / 0.65) 0%, transparent 72%), linear-gradient(140deg, oklch(0.42 0.13 262) 0%, oklch(0.28 0.10 292) 100%);
    color: var(--lg-text-primary);
    font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .cap { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: rgba(255,255,255,0.5); }
</style>
<style>@keyframes lg-spin { to { transform: rotate(360deg); } }</style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;gap:10px;padding:28px;font:var(--lg-type-mono);color:var(--lg-text-tertiary)"><span style="width:12px;height:12px;border-radius:999px;border:2px solid currentColor;border-top-color:transparent;animation:lg-spin 0.8s linear infinite"></span>Compiling Liquidglass — first load only</div></div>
<script type="text/lg-jsx" id="demo-src">
const { Button, IconButton, Icon } = L;
  function Demo() {
    return (
      <div className="col" style={{ gap: 16 }}>
        <div className="row">
          <Button variant="glass">Glass</Button>
          <Button variant="solid">Solid</Button>
          <Button variant="accent">Accent</Button>
          <Button variant="ghost">Ghost</Button>
          <Button variant="ghost" disabled>Disabled</Button>
        </div>
        <div className="row">
          <Button size="sm" variant="solid">Small</Button>
          <Button size="md" variant="solid">Medium</Button>
          <Button size="lg" variant="solid">Large</Button>
          <Button variant="ghost" iconLeft={<Icon name="download" size={16} />}>EPUB</Button>
        </div>
        <div className="row">
          <IconButton variant="glass" size="lg" label="Play"><Icon name="play" size={22} /></IconButton>
          <IconButton variant="solid" label="Next"><Icon name="skip-forward" size={18} /></IconButton>
          <IconButton variant="accent" label="Add"><Icon name="plus" size={18} /></IconButton>
          <IconButton variant="ghost" label="More"><Icon name="more-horizontal" size={18} /></IconButton>
          <IconButton variant="ghost" label="Off" disabled><Icon name="bookmark" size={18} /></IconButton>
        </div>
      </div>
    );
  }
</script>
<script>
(function () {
  var root = document.getElementById('root');
  function fail(e) {
    root.innerHTML = '<pre style="color:#fff;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap">' + String((e && e.stack) || e) + '</pre>';
  }
  window.LiquidglassDev.ready.then(function (L) {
    var src = document.getElementById('demo-src').textContent;
    var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
    new Function('L', 'React', 'ReactDOM', out + '\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Demo));')(L, window.React, window.ReactDOM);
  }).catch(fail);
}());
</script>
</body>
</html>
