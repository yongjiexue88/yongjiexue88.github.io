<!-- @dsCard group="Components" viewport="700x250" name="Toggles & Slider" subtitle="Switch, Checkbox, Radio, Slider" -->
<!DOCTYPE html>
<html lang="en" data-lg-theme="dark">
<head>
<meta charset="utf-8" />
<title>Toggles & Slider</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../dev-loader.js"></script>
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 250px; box-sizing: border-box; padding: 22px;
    background-color: var(--lg-neutral-950);
    background-image: radial-gradient(60% 60% at 22% 14%, oklch(0.60 0.20 330 / 0.9) 0%, transparent 72%), radial-gradient(55% 55% at 86% 34%, oklch(0.55 0.18 275 / 0.75) 0%, transparent 72%), radial-gradient(55% 55% at 50% 96%, oklch(0.50 0.16 300 / 0.7) 0%, transparent 72%), linear-gradient(140deg, oklch(0.40 0.15 330) 0%, oklch(0.26 0.11 285) 100%);
    color: var(--lg-text-primary);
    font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .cap { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: rgba(255,255,255,0.5); }
</style>
<style>@keyframes lg-spin { to { transform: rotate(360deg); } }</style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;gap:10px;padding:28px;font:var(--lg-type-mono);color:var(--lg-text-tertiary)"><span style="width:12px;height:12px;border-radius:999px;border:2px solid currentColor;border-top-color:transparent;animation:lg-spin 0.8s linear infinite"></span>Compiling Liquidglass — first load only</div></div>
<script type="text/lg-jsx" id="demo-src">
const { Switch, Checkbox, Radio, Slider } = L;
  function Demo() {
    const [on, setOn] = React.useState(true);
    const [vol, setVol] = React.useState(68);
    const [pick, setPick] = React.useState('sepia');
    return (
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px 28px', alignItems: 'start' }}>
        <div className="col" style={{ gap: 14 }}>
          <Switch checked={on} onChange={(e) => setOn(e.target.checked)} label="Reduce transparency" description="Swaps glass for solid fills." />
          <Switch size="sm" checked={false} onChange={() => {}} label="Sync reading position" />
          <Checkbox checked onChange={() => {}} label="Email me new chapters" />
          <Checkbox checked={false} onChange={() => {}} label="Include drafts" disabled />
        </div>
        <div className="col" style={{ gap: 14 }}>
          <Radio name="t" checked={pick === 'day'} onChange={() => setPick('day')} label="Day" />
          <Radio name="t" checked={pick === 'sepia'} onChange={() => setPick('sepia')} label="Sepia" description="Warm paper white." />
          <Slider label="Volume" value={vol} displayValue={vol + '%'} onChange={setVol} />
        </div>
      </div>
    );
  }
</script>
<script>
(function () {
  var root = document.getElementById('root');
  function fail(e) {
    root.innerHTML = '<pre style="color:#fff;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap">' + String((e && e.stack) || e) + '</pre>';
  }
  window.LiquidglassDev.ready.then(function (L) {
    var src = document.getElementById('demo-src').textContent;
    var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
    new Function('L', 'React', 'ReactDOM', out + '\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Demo));')(L, window.React, window.ReactDOM);
  }).catch(fail);
}());
</script>
</body>
</html>
