<!-- @dsCard group="Components" viewport="700x330" name="Surfaces" subtitle="Panel, Card, Avatar, Divider, ImagePlaceholder" -->
<!DOCTYPE html>
<html lang="en" data-lg-theme="dark">
<head>
<meta charset="utf-8" />
<title>Surfaces</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../dev-loader.js"></script>
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 330px; box-sizing: border-box; padding: 22px;
    background-color: var(--lg-neutral-950);
    background-image: radial-gradient(60% 60% at 80% 12%, oklch(0.66 0.16 170 / 0.85) 0%, transparent 72%), radial-gradient(55% 55% at 16% 64%, oklch(0.52 0.14 210 / 0.75) 0%, transparent 72%), radial-gradient(55% 55% at 58% 98%, oklch(0.60 0.13 140 / 0.6) 0%, transparent 72%), linear-gradient(140deg, oklch(0.44 0.12 175) 0%, oklch(0.27 0.09 212) 100%);
    color: var(--lg-text-primary);
    font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .cap { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: rgba(255,255,255,0.5); }
</style>
<style>@keyframes lg-spin { to { transform: rotate(360deg); } }</style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;gap:10px;padding:28px;font:var(--lg-type-mono);color:var(--lg-text-tertiary)"><span style="width:12px;height:12px;border-radius:999px;border:2px solid currentColor;border-top-color:transparent;animation:lg-spin 0.8s linear infinite"></span>Compiling Liquidglass — first load only</div></div>
<script type="text/lg-jsx" id="demo-src">
const { Panel, Card, Avatar, Divider, ImagePlaceholder, Badge } = L;
  function Demo() {
    return (
      <div style={{ display: 'grid', gridTemplateColumns: '1.15fr 1fr', gap: 18, alignItems: 'start' }}>
        <Panel padding="20px" cornerRadius={24}>
          <div className="col" style={{ gap: 12, width: '100%' }}>
            <div className="row" style={{ gap: 12 }}>
              <Avatar name="Ada Lovelace" ring />
              <div className="col" style={{ gap: 2 }}>
                <span style={{ font: 'var(--lg-type-label)' }}>Ada Lovelace</span>
                <span style={{ font: 'var(--lg-type-caption)', color: 'var(--lg-text-tertiary)' }}>11 essays · 2 books</span>
              </div>
              <Badge tone="success" dot style={{ marginLeft: 'auto' }}>Live</Badge>
            </div>
            <Divider />
            <span style={{ font: 'var(--lg-type-body)', color: 'var(--lg-text-secondary)' }}>Panel is the frosty container. Everything dense goes inside one.</span>
            <ImagePlaceholder label="author portrait — 16:9" ratio="16 / 5" />
          </div>
        </Panel>
        <Card
          eyebrow="Essay"
          title="On Refraction"
          description="Why the edge matters more than the blur."
          media={<ImagePlaceholder label="cover — 3:2" ratio="3 / 1.2" radius={12} />}
          footer={<span style={{ font: 'var(--lg-type-caption)', color: 'var(--lg-text-tertiary)' }}>8 min read</span>}
          onClick={() => {}}
        />
      </div>
    );
  }
</script>
<script>
(function () {
  var root = document.getElementById('root');
  function fail(e) {
    root.innerHTML = '<pre style="color:#fff;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap">' + String((e && e.stack) || e) + '</pre>';
  }
  window.LiquidglassDev.ready.then(function (L) {
    var src = document.getElementById('demo-src').textContent;
    var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
    new Function('L', 'React', 'ReactDOM', out + '\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Demo));')(L, window.React, window.ReactDOM);
  }).catch(fail);
}());
</script>
</body>
</html>
