<!-- @dsCard group="Components" viewport="700x350" name="Overlays" subtitle="Dialog and Sheet, shown inline" -->
<!DOCTYPE html>
<html lang="en" data-lg-theme="dark">
<head>
<meta charset="utf-8" />
<title>Overlays</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../dev-loader.js"></script>
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 350px; box-sizing: border-box; padding: 22px;
    background-color: var(--lg-neutral-950);
    background-image: radial-gradient(60% 60% at 26% 16%, oklch(0.68 0.18 50 / 0.85) 0%, transparent 72%), radial-gradient(55% 55% at 88% 60%, oklch(0.58 0.19 20 / 0.75) 0%, transparent 72%), radial-gradient(55% 55% at 8% 94%, oklch(0.50 0.15 320 / 0.6) 0%, transparent 72%), linear-gradient(140deg, oklch(0.47 0.15 45) 0%, oklch(0.29 0.12 12) 100%);
    color: var(--lg-text-primary);
    font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .cap { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: rgba(255,255,255,0.5); }
</style>
<style>@keyframes lg-spin { to { transform: rotate(360deg); } }</style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;gap:10px;padding:28px;font:var(--lg-type-mono);color:var(--lg-text-tertiary)"><span style="width:12px;height:12px;border-radius:999px;border:2px solid currentColor;border-top-color:transparent;animation:lg-spin 0.8s linear infinite"></span>Compiling Liquidglass — first load only</div></div>
<script type="text/lg-jsx" id="demo-src">
const { Dialog, Sheet, Button, Slider, SegmentedControl } = L;
  function Demo() {
    const [size, setSize] = React.useState(42);
    return (
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 18, alignItems: 'start' }}>
        <div style={{ position: 'relative', height: 300, borderRadius: 20, overflow: 'hidden', boxShadow: 'inset 0 0 0 1px var(--lg-border-subtle)' }}>
          <Dialog
            open
            title="Delete draft?"
            description="This cannot be undone."
            width="100%"
            footer={<><Button variant="ghost" size="sm">Cancel</Button><Button variant="accent" size="sm">Delete</Button></>}
            style={{ position: 'absolute' }}
          />
        </div>
        <div style={{ position: 'relative', height: 300, borderRadius: 20, overflow: 'hidden', boxShadow: 'inset 0 0 0 1px var(--lg-border-subtle)' }}>
          <Sheet open side="bottom" style={{ position: 'absolute' }}>
            <div className="col" style={{ gap: 14, width: '100%' }}>
              <span style={{ font: 'var(--lg-type-heading)' }}>Display</span>
              <SegmentedControl fullWidth options={['Day', 'Sepia', 'Night']} value="Sepia" onChange={() => {}} />
              <Slider label="Text size" value={size} displayValue={size + 'pt'} onChange={setSize} />
            </div>
          </Sheet>
        </div>
      </div>
    );
  }
</script>
<script>
(function () {
  var root = document.getElementById('root');
  function fail(e) {
    root.innerHTML = '<pre style="color:#fff;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap">' + String((e && e.stack) || e) + '</pre>';
  }
  window.LiquidglassDev.ready.then(function (L) {
    var src = document.getElementById('demo-src').textContent;
    var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
    new Function('L', 'React', 'ReactDOM', out + '\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Demo));')(L, window.React, window.ReactDOM);
  }).catch(fail);
}());
</script>
</body>
</html>
