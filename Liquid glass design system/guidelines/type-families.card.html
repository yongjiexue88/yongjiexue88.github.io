<!-- @dsCard group="Type" viewport="700x160" name="Families" subtitle="Geist and Geist Mono — a substitution; the source ships bare system-ui" -->
<!DOCTYPE html>
<html lang="en" data-lg-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 160px; box-sizing: border-box; padding: 20px;
    background: var(--lg-neutral-950);
    color: var(--lg-text-primary); font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; gap: 10px; }
  .col { display: flex; flex-direction: column; }
  .t { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: var(--lg-text-tertiary); }
  .v { font: var(--lg-type-mono); color: var(--lg-text-secondary); }
  
</style>
</head>
<body>
<div class="col" style="gap:18px">
  <div class="col" style="gap:4px">
    <div style="font-family:var(--lg-font-sans);font-size:34px;font-weight:500;letter-spacing:var(--lg-tracking-tight)">Geist — ABCDEFGHIJKabcdefghijk 0123456789</div>
    <span class="v" style="font-size:10px">--lg-font-sans · 300 400 500 600 700</span>
  </div>
  <div class="col" style="gap:4px">
    <div style="font-family:var(--lg-font-mono);font-size:24px;font-weight:400">Geist Mono — 0123456789 {} &lt;/&gt;</div>
    <span class="v" style="font-size:10px">--lg-font-mono · 400 500 · labels, tokens, timecodes</span>
  </div>
</div>
</body>
</html>
