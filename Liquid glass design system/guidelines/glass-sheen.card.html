<!-- @dsCard group="Glass" viewport="700x170" name="Interaction sheen" subtitle="Rest → hover → press. Only interactive glass gets it" -->
<!DOCTYPE html>
<html lang="en" data-lg-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 170px; box-sizing: border-box; padding: 20px;
    background: var(--lg-neutral-1000) radial-gradient(70% 90% at 20% 0%, oklch(0.62 0.19 250 / 0.85) 0%, transparent 70%), radial-gradient(60% 80% at 90% 100%, oklch(0.54 0.17 320 / 0.75) 0%, transparent 70%), linear-gradient(140deg, oklch(0.40 0.12 262), oklch(0.26 0.09 292));
    color: var(--lg-text-primary); font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; gap: 10px; }
  .col { display: flex; flex-direction: column; }
  .t { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: var(--lg-text-tertiary); }
  .v { font: var(--lg-type-mono); color: var(--lg-text-secondary); }
  
</style>
</head>
<body>
<div class="row" style="gap:14px">
  <div style="flex:1;height:100px;border-radius:var(--lg-radius-pill);background:var(--lg-white-08);backdrop-filter:var(--lg-backdrop);box-shadow:var(--lg-edge-inset);position:relative;overflow:hidden;transform:scale(1);display:flex;align-items:center;justify-content:center">
    
    <span style="font:var(--lg-type-glass-label);text-shadow:var(--lg-text-shadow-glass)">rest</span>
  </div><div style="flex:1;height:100px;border-radius:var(--lg-radius-pill);background:var(--lg-white-08);backdrop-filter:var(--lg-backdrop);box-shadow:var(--lg-edge-inset);position:relative;overflow:hidden;transform:scale(1);display:flex;align-items:center;justify-content:center">
    <span style="position:absolute;left:0;right:0;top:0;height:50%;background:var(--lg-sheen-hover);opacity:0.5;mix-blend-mode:overlay"></span>
    <span style="font:var(--lg-type-glass-label);text-shadow:var(--lg-text-shadow-glass)">hover</span>
  </div><div style="flex:1;height:100px;border-radius:var(--lg-radius-pill);background:var(--lg-white-08);backdrop-filter:var(--lg-backdrop);box-shadow:var(--lg-edge-inset);position:relative;overflow:hidden;transform:scale(0.96);display:flex;align-items:center;justify-content:center">
    <span style="position:absolute;left:0;right:0;top:0;height:50%;background:var(--lg-sheen-press);opacity:0.5;mix-blend-mode:overlay"></span>
    <span style="font:var(--lg-type-glass-label);text-shadow:var(--lg-text-shadow-glass)">press</span>
  </div>
</div>
<div class="t" style="margin-top:12px">press also scales to 0.96 · --lg-scale-press</div>
</body>
</html>
