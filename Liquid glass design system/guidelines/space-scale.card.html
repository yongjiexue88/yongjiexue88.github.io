<!-- @dsCard group="Space" viewport="700x150" name="Spacing scale" subtitle="2 → 128px; steps 5–9 carry almost all layout" -->
<!DOCTYPE html>
<html lang="en" data-lg-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 150px; box-sizing: border-box; padding: 20px;
    background: var(--lg-neutral-950);
    color: var(--lg-text-primary); font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; gap: 10px; }
  .col { display: flex; flex-direction: column; }
  .t { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: var(--lg-text-tertiary); }
  .v { font: var(--lg-type-mono); color: var(--lg-text-secondary); }
  
</style>
</head>
<body>
<div style="display:flex;align-items:flex-end;gap:8px">
  <div class="col" style="align-items:center;gap:6px">
    <div style="width:2px;height:2px;min-width:2px;border-radius:2px;background:var(--lg-azure-bright)"></div>
    <span class="v" style="font-size:9px">1</span>
    <span class="v" style="font-size:9px;color:var(--lg-text-disabled)">2</span>
  </div><div class="col" style="align-items:center;gap:6px">
    <div style="width:4px;height:4px;min-width:2px;border-radius:2px;background:var(--lg-azure-bright)"></div>
    <span class="v" style="font-size:9px">2</span>
    <span class="v" style="font-size:9px;color:var(--lg-text-disabled)">4</span>
  </div><div class="col" style="align-items:center;gap:6px">
    <div style="width:6px;height:6px;min-width:2px;border-radius:2px;background:var(--lg-azure-bright)"></div>
    <span class="v" style="font-size:9px">3</span>
    <span class="v" style="font-size:9px;color:var(--lg-text-disabled)">6</span>
  </div><div class="col" style="align-items:center;gap:6px">
    <div style="width:8px;height:8px;min-width:2px;border-radius:2px;background:var(--lg-azure-bright)"></div>
    <span class="v" style="font-size:9px">4</span>
    <span class="v" style="font-size:9px;color:var(--lg-text-disabled)">8</span>
  </div><div class="col" style="align-items:center;gap:6px">
    <div style="width:12px;height:12px;min-width:2px;border-radius:2px;background:var(--lg-azure-bright)"></div>
    <span class="v" style="font-size:9px">5</span>
    <span class="v" style="font-size:9px;color:var(--lg-text-disabled)">12</span>
  </div><div class="col" style="align-items:center;gap:6px">
    <div style="width:16px;height:16px;min-width:2px;border-radius:2px;background:var(--lg-azure-bright)"></div>
    <span class="v" style="font-size:9px">6</span>
    <span class="v" style="font-size:9px;color:var(--lg-text-disabled)">16</span>
  </div><div class="col" style="align-items:center;gap:6px">
    <div style="width:20px;height:20px;min-width:2px;border-radius:2px;background:var(--lg-azure-bright)"></div>
    <span class="v" style="font-size:9px">7</span>
    <span class="v" style="font-size:9px;color:var(--lg-text-disabled)">20</span>
  </div><div class="col" style="align-items:center;gap:6px">
    <div style="width:24px;height:24px;min-width:2px;border-radius:2px;background:var(--lg-azure-bright)"></div>
    <span class="v" style="font-size:9px">8</span>
    <span class="v" style="font-size:9px;color:var(--lg-text-disabled)">24</span>
  </div><div class="col" style="align-items:center;gap:6px">
    <div style="width:32px;height:32px;min-width:2px;border-radius:2px;background:var(--lg-azure-bright)"></div>
    <span class="v" style="font-size:9px">9</span>
    <span class="v" style="font-size:9px;color:var(--lg-text-disabled)">32</span>
  </div><div class="col" style="align-items:center;gap:6px">
    <div style="width:40px;height:40px;min-width:2px;border-radius:2px;background:var(--lg-azure-bright)"></div>
    <span class="v" style="font-size:9px">10</span>
    <span class="v" style="font-size:9px;color:var(--lg-text-disabled)">40</span>
  </div><div class="col" style="align-items:center;gap:6px">
    <div style="width:48px;height:48px;min-width:2px;border-radius:2px;background:var(--lg-azure-bright)"></div>
    <span class="v" style="font-size:9px">11</span>
    <span class="v" style="font-size:9px;color:var(--lg-text-disabled)">48</span>
  </div><div class="col" style="align-items:center;gap:6px">
    <div style="width:64px;height:64px;min-width:2px;border-radius:2px;background:var(--lg-azure-bright)"></div>
    <span class="v" style="font-size:9px">12</span>
    <span class="v" style="font-size:9px;color:var(--lg-text-disabled)">64</span>
  </div>
</div>
</body>
</html>
