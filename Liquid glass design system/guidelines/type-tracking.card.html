<!-- @dsCard group="Type" viewport="700x160" name="Tracking" subtitle="Negative by default; only mono caps opens up" -->
<!DOCTYPE html>
<html lang="en" data-lg-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 160px; box-sizing: border-box; padding: 20px;
    background: var(--lg-neutral-950);
    color: var(--lg-text-primary); font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; gap: 10px; }
  .col { display: flex; flex-direction: column; }
  .t { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: var(--lg-text-tertiary); }
  .v { font: var(--lg-type-mono); color: var(--lg-text-secondary); }
  
</style>
</head>
<body>
<div class="col" style="gap:10px">
  <div style="display:flex;align-items:baseline;gap:16px">
    <span class="v" style="width:70px;font-size:10px">tighter</span>
    <span style="font-size:19px;font-weight:500;letter-spacing:-0.035em;">Displacement map</span>
    <span class="v" style="font-size:10px;margin-left:auto">-0.035em</span>
  </div><div style="display:flex;align-items:baseline;gap:16px">
    <span class="v" style="width:70px;font-size:10px">tight</span>
    <span style="font-size:19px;font-weight:500;letter-spacing:-0.02em;">Displacement map</span>
    <span class="v" style="font-size:10px;margin-left:auto">-0.02em</span>
  </div><div style="display:flex;align-items:baseline;gap:16px">
    <span class="v" style="width:70px;font-size:10px">normal</span>
    <span style="font-size:19px;font-weight:500;letter-spacing:-0.006em;">Displacement map</span>
    <span class="v" style="font-size:10px;margin-left:auto">-0.006em</span>
  </div><div style="display:flex;align-items:baseline;gap:16px">
    <span class="v" style="width:70px;font-size:10px">wide</span>
    <span style="font-size:19px;font-weight:500;letter-spacing:0.02em;">Displacement map</span>
    <span class="v" style="font-size:10px;margin-left:auto">0.02em</span>
  </div><div style="display:flex;align-items:baseline;gap:16px">
    <span class="v" style="width:70px;font-size:10px">caps</span>
    <span style="font-size:19px;font-weight:500;letter-spacing:0.09em;text-transform:uppercase;font-size:13px;font-family:var(--lg-font-mono)">Displacement map</span>
    <span class="v" style="font-size:10px;margin-left:auto">0.09em</span>
  </div>
</div>
</body>
</html>
