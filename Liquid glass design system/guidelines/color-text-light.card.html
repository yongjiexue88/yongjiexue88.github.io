<!-- @dsCard group="Colors" viewport="700x150" name="Text on light" subtitle="Same roles under [data-lg-theme=\"light\"] — ink alphas, not greys" -->
<!DOCTYPE html>
<html lang="en" data-lg-theme="light">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 150px; box-sizing: border-box; padding: 20px;
    background: var(--lg-bg-base);
    color: var(--lg-text-primary); font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; gap: 10px; }
  .col { display: flex; flex-direction: column; }
  .t { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: var(--lg-text-tertiary); }
  .v { font: var(--lg-type-mono); color: var(--lg-text-secondary); }
  
</style>
</head>
<body>
<div class="col" style="gap:12px">
  <div style="display:flex;align-items:baseline;gap:16px"><span class="v" style="width:96px;font-size:10px">primary</span><span style="color:var(--lg-text-primary);font-size:15px;font-weight:400">Refraction is the brand. Type stays quiet.</span></div><div style="display:flex;align-items:baseline;gap:16px"><span class="v" style="width:96px;font-size:10px">secondary</span><span style="color:var(--lg-text-secondary);font-size:15px;font-weight:400">Refraction is the brand. Type stays quiet.</span></div><div style="display:flex;align-items:baseline;gap:16px"><span class="v" style="width:96px;font-size:10px">tertiary</span><span style="color:var(--lg-text-tertiary);font-size:13px;font-weight:400">Refraction is the brand. Type stays quiet.</span></div><div style="display:flex;align-items:baseline;gap:16px"><span class="v" style="width:96px;font-size:10px">disabled</span><span style="color:var(--lg-text-disabled);font-size:13px;font-weight:400">Refraction is the brand. Type stays quiet.</span></div>
</div>
</body>
</html>
