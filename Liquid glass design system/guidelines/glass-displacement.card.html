<!-- @dsCard group="Glass" viewport="700x150" name="Displacement scales" subtitle="70 default, 25 subtle, halved automatically over light grounds" -->
<!DOCTYPE html>
<html lang="en" data-lg-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 150px; box-sizing: border-box; padding: 20px;
    background: var(--lg-neutral-950);
    color: var(--lg-text-primary); font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; gap: 10px; }
  .col { display: flex; flex-direction: column; }
  .t { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: var(--lg-text-tertiary); }
  .v { font: var(--lg-type-mono); color: var(--lg-text-secondary); }
  
</style>
</head>
<body>
<div class="col" style="gap:12px">
  <div style="display:flex;align-items:center;gap:14px">
    <span class="v" style="width:34px;font-size:13px;color:var(--lg-text-primary)">70</span>
    <span style="height:10px;width:100%;border-radius:999px;background:linear-gradient(90deg, var(--lg-azure-bright), var(--lg-orchid))"></span>
    <span class="v" style="font-size:10px">standard — buttons, docks, pills</span>
  </div><div style="display:flex;align-items:center;gap:14px">
    <span class="v" style="width:34px;font-size:13px;color:var(--lg-text-primary)">25</span>
    <span style="height:10px;width:36%;border-radius:999px;background:linear-gradient(90deg, var(--lg-azure-bright), var(--lg-orchid))"></span>
    <span class="v" style="font-size:10px">subtle — large panels, long text</span>
  </div><div style="display:flex;align-items:center;gap:14px">
    <span class="v" style="width:34px;font-size:13px;color:var(--lg-text-primary)">35</span>
    <span style="height:10px;width:50%;border-radius:999px;background:linear-gradient(90deg, var(--lg-azure-bright), var(--lg-orchid))"></span>
    <span class="v" style="font-size:10px">over light (70 ÷ 2)</span>
  </div>
</div>
</body>
</html>
