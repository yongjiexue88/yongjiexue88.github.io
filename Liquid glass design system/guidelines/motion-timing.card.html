<!-- @dsCard group="Motion" viewport="700x150" name="Timing" subtitle="Three durations, two curves — all lifted from the source component" -->
<!DOCTYPE html>
<html lang="en" data-lg-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 150px; box-sizing: border-box; padding: 20px;
    background: var(--lg-neutral-950);
    color: var(--lg-text-primary); font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; gap: 10px; }
  .col { display: flex; flex-direction: column; }
  .t { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: var(--lg-text-tertiary); }
  .v { font: var(--lg-type-mono); color: var(--lg-text-secondary); }
  
</style>
</head>
<body>
<div class="col" style="gap:12px">
  <div style="display:flex;align-items:center;gap:12px">
    <span class="v" style="width:42px;font-size:10px">fast</span>
    <span class="v" style="width:52px;font-size:10px;color:var(--lg-text-primary)">150ms</span>
    <span style="height:6px;width:24%;border-radius:999px;background:var(--lg-white-32)"></span>
    <span class="v" style="font-size:10px;margin-left:auto">ease-in-out · content + overLight crossfades</span>
  </div><div style="display:flex;align-items:center;gap:12px">
    <span class="v" style="width:42px;font-size:10px">base</span>
    <span class="v" style="width:52px;font-size:10px;color:var(--lg-text-primary)">200ms</span>
    <span style="height:6px;width:32%;border-radius:999px;background:var(--lg-white-32)"></span>
    <span class="v" style="font-size:10px;margin-left:auto">ease-in-out · glass body, borders, sheen</span>
  </div><div style="display:flex;align-items:center;gap:12px">
    <span class="v" style="width:42px;font-size:10px">slow</span>
    <span class="v" style="width:52px;font-size:10px;color:var(--lg-text-primary)">320ms</span>
    <span style="height:6px;width:52%;border-radius:999px;background:var(--lg-white-32)"></span>
    <span class="v" style="font-size:10px;margin-left:auto">ease-out · progress fills, sheet + dialog entry</span>
  </div>
</div>
</body>
</html>
