<!-- @dsCard group="Colors" viewport="700x124" name="Semantic hues" subtitle="Carried by text and edge, not by filled blocks" -->
<!DOCTYPE html>
<html lang="en" data-lg-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 124px; box-sizing: border-box; padding: 20px;
    background: var(--lg-neutral-950);
    color: var(--lg-text-primary); font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; gap: 10px; }
  .col { display: flex; flex-direction: column; }
  .t { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: var(--lg-text-tertiary); }
  .v { font: var(--lg-type-mono); color: var(--lg-text-secondary); }
  
</style>
</head>
<body>
<div class="row" style="gap:10px">
  <div style="flex:1;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--lg-radius-md);background:color-mix(in oklab, var(--lg-hue-success) 14%, transparent);box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--lg-hue-success) 40%, transparent)">
    <span style="width:8px;height:8px;border-radius:999px;background:var(--lg-hue-success)"></span>
    <span style="font:var(--lg-type-label);color:var(--lg-hue-success)">success</span>
  </div><div style="flex:1;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--lg-radius-md);background:color-mix(in oklab, var(--lg-hue-warning) 14%, transparent);box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--lg-hue-warning) 40%, transparent)">
    <span style="width:8px;height:8px;border-radius:999px;background:var(--lg-hue-warning)"></span>
    <span style="font:var(--lg-type-label);color:var(--lg-hue-warning)">warning</span>
  </div><div style="flex:1;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--lg-radius-md);background:color-mix(in oklab, var(--lg-hue-danger) 14%, transparent);box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--lg-hue-danger) 40%, transparent)">
    <span style="width:8px;height:8px;border-radius:999px;background:var(--lg-hue-danger)"></span>
    <span style="font:var(--lg-type-label);color:var(--lg-hue-danger)">danger</span>
  </div><div style="flex:1;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--lg-radius-md);background:color-mix(in oklab, var(--lg-hue-info) 14%, transparent);box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--lg-hue-info) 40%, transparent)">
    <span style="width:8px;height:8px;border-radius:999px;background:var(--lg-hue-info)"></span>
    <span style="font:var(--lg-type-label);color:var(--lg-hue-info)">info</span>
  </div>
</div>
</body>
</html>
