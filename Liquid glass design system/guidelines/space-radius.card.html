<!-- @dsCard group="Space" viewport="700x150" name="Corner radii" subtitle="Glass defaults to pill; panels take xl and up" -->
<!DOCTYPE html>
<html lang="en" data-lg-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 150px; box-sizing: border-box; padding: 20px;
    background: var(--lg-neutral-1000) radial-gradient(70% 90% at 20% 0%, oklch(0.62 0.19 250 / 0.85) 0%, transparent 70%), radial-gradient(60% 80% at 90% 100%, oklch(0.54 0.17 320 / 0.75) 0%, transparent 70%), linear-gradient(140deg, oklch(0.40 0.12 262), oklch(0.26 0.09 292));
    color: var(--lg-text-primary); font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; gap: 10px; }
  .col { display: flex; flex-direction: column; }
  .t { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: var(--lg-text-tertiary); }
  .v { font: var(--lg-type-mono); color: var(--lg-text-secondary); }
  
</style>
</head>
<body>
<div class="row" style="gap:10px">
  <div class="col" style="flex:1;gap:8px;align-items:center">
    <div style="width:100%;height:58px;border-radius:4px;background:var(--lg-white-08);box-shadow:inset 0 0 0 1.5px var(--lg-white-20)"></div>
    <span class="v" style="font-size:9px">xs · 4</span>
  </div><div class="col" style="flex:1;gap:8px;align-items:center">
    <div style="width:100%;height:58px;border-radius:8px;background:var(--lg-white-08);box-shadow:inset 0 0 0 1.5px var(--lg-white-20)"></div>
    <span class="v" style="font-size:9px">sm · 8</span>
  </div><div class="col" style="flex:1;gap:8px;align-items:center">
    <div style="width:100%;height:58px;border-radius:12px;background:var(--lg-white-08);box-shadow:inset 0 0 0 1.5px var(--lg-white-20)"></div>
    <span class="v" style="font-size:9px">md · 12</span>
  </div><div class="col" style="flex:1;gap:8px;align-items:center">
    <div style="width:100%;height:58px;border-radius:16px;background:var(--lg-white-08);box-shadow:inset 0 0 0 1.5px var(--lg-white-20)"></div>
    <span class="v" style="font-size:9px">lg · 16</span>
  </div><div class="col" style="flex:1;gap:8px;align-items:center">
    <div style="width:100%;height:58px;border-radius:24px;background:var(--lg-white-08);box-shadow:inset 0 0 0 1.5px var(--lg-white-20)"></div>
    <span class="v" style="font-size:9px">xl · 24</span>
  </div><div class="col" style="flex:1;gap:8px;align-items:center">
    <div style="width:100%;height:58px;border-radius:32px;background:var(--lg-white-08);box-shadow:inset 0 0 0 1.5px var(--lg-white-20)"></div>
    <span class="v" style="font-size:9px">2xl · 32</span>
  </div><div class="col" style="flex:1;gap:8px;align-items:center">
    <div style="width:100%;height:58px;border-radius:44px;background:var(--lg-white-08);box-shadow:inset 0 0 0 1.5px var(--lg-white-20)"></div>
    <span class="v" style="font-size:9px">3xl · 44</span>
  </div><div class="col" style="flex:1;gap:8px;align-items:center">
    <div style="width:100%;height:58px;border-radius:999px;background:var(--lg-white-08);box-shadow:inset 0 0 0 1.5px var(--lg-white-20)"></div>
    <span class="v" style="font-size:9px">pill · 999</span>
  </div>
</div>
</body>
</html>
