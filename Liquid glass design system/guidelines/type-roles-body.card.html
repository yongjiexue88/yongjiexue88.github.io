<!-- @dsCard group="Type" viewport="700x180" name="Body roles" subtitle="body / label / caption / mono — 1.65 leading on body, 68ch measure" -->
<!DOCTYPE html>
<html lang="en" data-lg-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 180px; box-sizing: border-box; padding: 20px;
    background: var(--lg-neutral-950);
    color: var(--lg-text-primary); font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; gap: 10px; }
  .col { display: flex; flex-direction: column; }
  .t { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: var(--lg-text-tertiary); }
  .v { font: var(--lg-type-mono); color: var(--lg-text-secondary); }
  
</style>
</head>
<body>
<div class="col" style="gap:12px">
  <span style="font:var(--lg-type-body);max-width:var(--lg-measure)">Body copy runs at 15px on 1.65 leading, capped at a 68-character measure. On glass it gets a text shadow; on solid surfaces it does not.</span>
  <div class="row" style="gap:28px;align-items:baseline">
    <span style="font:var(--lg-type-label)">Label 13/500</span>
    <span style="font:var(--lg-type-caption);color:var(--lg-text-tertiary)">Caption 12/400</span>
    <span style="font:var(--lg-type-mono);letter-spacing:var(--lg-tracking-caps);text-transform:uppercase;color:var(--lg-text-tertiary)">Mono caps 12</span>
    <span style="font:var(--lg-type-glass-label)">Glass label 20/500</span>
  </div>
</div>
</body>
</html>
