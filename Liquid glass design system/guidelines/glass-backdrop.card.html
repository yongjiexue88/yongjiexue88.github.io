<!-- @dsCard group="Glass" viewport="700x180" name="Backdrop levels" subtitle="blurAmount × 32 = px. Default is nearly clear; frosty is for text-heavy panels" -->
<!DOCTYPE html>
<html lang="en" data-lg-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 180px; box-sizing: border-box; padding: 20px;
    background: var(--lg-neutral-1000) radial-gradient(70% 90% at 20% 0%, oklch(0.62 0.19 250 / 0.85) 0%, transparent 70%), radial-gradient(60% 80% at 90% 100%, oklch(0.54 0.17 320 / 0.75) 0%, transparent 70%), linear-gradient(140deg, oklch(0.40 0.12 262), oklch(0.26 0.09 292));
    color: var(--lg-text-primary); font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; gap: 10px; }
  .col { display: flex; flex-direction: column; }
  .t { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: var(--lg-text-tertiary); }
  .v { font: var(--lg-type-mono); color: var(--lg-text-secondary); }
  
</style>
</head>
<body>
<div class="row" style="gap:12px">
  <div style="flex:1;height:112px;border-radius:var(--lg-radius-lg);background:var(--lg-white-08);backdrop-filter:var(--lg-backdrop);box-shadow:var(--lg-edge-inset);display:flex;flex-direction:column;justify-content:flex-end;gap:3px;padding:12px">
    <span style="font:var(--lg-type-label);text-shadow:var(--lg-text-shadow-glass)">default</span>
    <span class="v" style="font-size:10px">0.0625 · 2px</span>
  </div><div style="flex:1;height:112px;border-radius:var(--lg-radius-lg);background:var(--lg-white-08);backdrop-filter:var(--lg-backdrop-over-light);box-shadow:var(--lg-edge-inset);display:flex;flex-direction:column;justify-content:flex-end;gap:3px;padding:12px">
    <span style="font:var(--lg-type-label);text-shadow:var(--lg-text-shadow-glass)">over light</span>
    <span class="v" style="font-size:10px">14px blur</span>
  </div><div style="flex:1;height:112px;border-radius:var(--lg-radius-lg);background:var(--lg-white-08);backdrop-filter:var(--lg-backdrop-frosty);box-shadow:var(--lg-edge-inset);display:flex;flex-direction:column;justify-content:flex-end;gap:3px;padding:12px">
    <span style="font:var(--lg-type-label);text-shadow:var(--lg-text-shadow-glass)">frosty</span>
    <span class="v" style="font-size:10px">0.35 · 25.2px</span>
  </div>
</div>
</body>
</html>
