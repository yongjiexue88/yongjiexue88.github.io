<!DOCTYPE html>
<html lang="en" data-lg-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 140px; box-sizing: border-box; padding: 20px;
    background: var(--lg-neutral-1000) radial-gradient(70% 90% at 20% 0%, oklch(0.62 0.19 250 / 0.85) 0%, transparent 70%), radial-gradient(60% 80% at 90% 100%, oklch(0.54 0.17 320 / 0.75) 0%, transparent 70%), linear-gradient(140deg, oklch(0.40 0.12 262), oklch(0.26 0.09 292));
    color: var(--lg-text-primary); font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; gap: 10px; }
  .col { display: flex; flex-direction: column; }
  .t { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: var(--lg-text-tertiary); }
  .v { font: var(--lg-type-mono); color: var(--lg-text-secondary); }
  
</style>
</head>
<body>
<div class="row" style="gap:6px">
  <div class="col" style="flex:1;gap:8px">
    <div style="height:52px;border-radius:var(--lg-radius-sm);background:var(--lg-white-04);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06)"></div>
    <span class="v" style="font-size:10px;text-align:center">white-04</span>
  </div><div class="col" style="flex:1;gap:8px">
    <div style="height:52px;border-radius:var(--lg-radius-sm);background:var(--lg-white-08);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06)"></div>
    <span class="v" style="font-size:10px;text-align:center">white-08</span>
  </div><div class="col" style="flex:1;gap:8px">
    <div style="height:52px;border-radius:var(--lg-radius-sm);background:var(--lg-white-12);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06)"></div>
    <span class="v" style="font-size:10px;text-align:center">white-12</span>
  </div><div class="col" style="flex:1;gap:8px">
    <div style="height:52px;border-radius:var(--lg-radius-sm);background:var(--lg-white-20);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06)"></div>
    <span class="v" style="font-size:10px;text-align:center">white-20</span>
  </div><div class="col" style="flex:1;gap:8px">
    <div style="height:52px;border-radius:var(--lg-radius-sm);background:var(--lg-white-32);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06)"></div>
    <span class="v" style="font-size:10px;text-align:center">white-32</span>
  </div><div class="col" style="flex:1;gap:8px">
    <div style="height:52px;border-radius:var(--lg-radius-sm);background:var(--lg-white-50);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06)"></div>
    <span class="v" style="font-size:10px;text-align:center">white-50</span>
  </div><div class="col" style="flex:1;gap:8px">
    <div style="height:52px;border-radius:var(--lg-radius-sm);background:var(--lg-white-60);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06)"></div>
    <span class="v" style="font-size:10px;text-align:center">white-60</span>
  </div>
</div>
</body>
</html>
