<!-- @dsCard group="Glass" viewport="700x180" name="Elevation" subtitle="Glass casts one wide soft shadow and never stacks; solid surfaces use contact + ambient" -->
<!DOCTYPE html>
<html lang="en" data-lg-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body {
    width: 700px; min-height: 180px; box-sizing: border-box; padding: 20px;
    background: var(--lg-neutral-1000) radial-gradient(70% 90% at 20% 0%, oklch(0.62 0.19 250 / 0.85) 0%, transparent 70%), radial-gradient(60% 80% at 90% 100%, oklch(0.54 0.17 320 / 0.75) 0%, transparent 70%), linear-gradient(140deg, oklch(0.40 0.12 262), oklch(0.26 0.09 292));
    color: var(--lg-text-primary); font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }
  .row { display: flex; gap: 10px; }
  .col { display: flex; flex-direction: column; }
  .t { font: var(--lg-type-mono); letter-spacing: var(--lg-tracking-caps); text-transform: uppercase; color: var(--lg-text-tertiary); }
  .v { font: var(--lg-type-mono); color: var(--lg-text-secondary); }
  
</style>
</head>
<body>
<div class="row" style="gap:14px;align-items:center">
  <div style="flex:1;height:96px;border-radius:var(--lg-radius-lg);background:var(--lg-white-08);backdrop-filter:var(--lg-backdrop);box-shadow:var(--lg-shadow-glass), var(--lg-edge-inset);display:flex;align-items:flex-end;padding:12px"><span class="v" style="font-size:10px">shadow-glass</span></div>
  <div style="flex:1;height:96px;border-radius:var(--lg-radius-lg);background:var(--lg-solid-fill);box-shadow:var(--lg-shadow-1);display:flex;align-items:flex-end;padding:12px"><span class="v" style="font-size:10px">shadow-1</span></div><div style="flex:1;height:96px;border-radius:var(--lg-radius-lg);background:var(--lg-solid-fill);box-shadow:var(--lg-shadow-2);display:flex;align-items:flex-end;padding:12px"><span class="v" style="font-size:10px">shadow-2</span></div><div style="flex:1;height:96px;border-radius:var(--lg-radius-lg);background:var(--lg-solid-fill);box-shadow:var(--lg-shadow-3);display:flex;align-items:flex-end;padding:12px"><span class="v" style="font-size:10px">shadow-3</span></div><div style="flex:1;height:96px;border-radius:var(--lg-radius-lg);background:var(--lg-solid-fill);box-shadow:var(--lg-shadow-4);display:flex;align-items:flex-end;padding:12px"><span class="v" style="font-size:10px">shadow-4</span></div>
</div>
</body>
</html>
