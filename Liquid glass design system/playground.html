<style>
  html, body { margin: 0; }
  body {
    background: var(--lg-bg-base);
    color: var(--lg-text-primary);
    font: var(--lg-type-body);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--lg-text-accent); text-decoration: none; }
  a:hover { color: var(--lg-fill-accent-hover); }

<body>
<div id="root"><div style="display:flex;align-items:center;gap:10px;padding:28px;font:var(--lg-type-mono);color:var(--lg-text-tertiary)"><span style="width:12px;height:12px;border-radius:999px;border:2px solid currentColor;border-top-color:transparent;animation:lg-spin 0.8s linear infinite"></span>Compiling Liquidglass — first load only</div></div>
<script>
(function () {
  var root = document.getElementById('root');
  function fail(e) {
    root.innerHTML = '<pre style="color:#fff;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;padding:24px">' + String((e && e.stack) || e) + '</pre>';
  }
  window.LiquidglassDev.ready
    .then(function () { return window.LiquidglassDev.load(['playground.jsx']); })
    .then(function (L) { ReactDOM.createRoot(root).render(React.createElement(L.Playground)); })
    .catch(fail);
}());
</script>
