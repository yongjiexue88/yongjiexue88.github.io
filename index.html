    <body style="background-color: #E9F7F4">
        <div id="root"></div>
        <script type="text/javascript">
            /**
             * Counterpart to public/404.html. Decodes the /?/path form that the
             * Pages fallback produces back into a real path, before React mounts,
             * so react-router sees the URL the visitor actually asked for.
             */
            (function (l) {
                if (l.search[1] === '/') {
                    var decoded = l.search.slice(1).split('&').map(function (s) {
                        return s.replace(/~and~/g, '&')
                    }).join('?');
                    window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
                }
            }(window.location))
        </script>
