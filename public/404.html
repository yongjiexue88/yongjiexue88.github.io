<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>Yongjie Xue | Personal Blog</title>
        <meta name="robots" content="noindex"/>
        <script type="text/javascript">
            /**
             * GitHub Pages SPA fallback.
             *
             * Pages serves this file for any path it cannot find on disk, and it
             * offers no rewrite rules. So a hard refresh on a client-side route
             * such as /notes/some-slug would 404 without this shim.
             *
             * It rewrites  /notes/some-slug?a=b#c
             * into         /?/notes/some-slug&a=b#c
             * and redirects. The counterpart script in index.html decodes it back
             * before React mounts, so the router sees the original path.
             *
             * This site is a user page served from the domain root, so no leading
             * path segments need preserving.
             */
            var pathSegmentsToKeep = 0;

            var l = window.location;
            l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
                l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
                (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                l.hash
            );
        </script>
    </head>
    <body></body>
</html>
