bio:
  eyebrow: 个人简介
  title: 以写作者的眼光做工程
  content: >-
    ### 关于我

    我是一名常驻美国奥斯汀的全栈与 AI 工程师。

    这个网站是我的职业主页，也是我公开记录个人思考的地方：涵盖系统工程、语言学习、职业发展、科技趋势，以及普通日常生活中的体悟。

    ### 写作与探索的主题

    - **自我反思**：记录选择、思维模式、挑战与成长，思考自己正在成为怎样的人。
    - **日常记录**：记录普通日子里的小记忆、生活节奏、家庭、健康与重要片刻。
    - **公开学习**：关于书籍、英语学习、技术架构与系统的深度阅读与探索。

columns:
