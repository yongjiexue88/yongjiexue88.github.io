# yongjiexue88.github.io — Hugo site configuration
# Theme: OINK v1.0.0 (github.com/pgsty/oink)

baseURL: https://yongjiexue88.github.io/
title: 萦怀 · Yongjie Xue
defaultContentLanguage: zh-cn
enableRobotsTXT: true

server:
  headers:
    - for: /**
      values:
        Access-Control-Allow-Origin: '*'
enableEmoji: true
enableGitInfo: false
hasCJKLanguage: true
summaryLength: 50
buildDrafts: false
buildFuture: false

taxonomies:
  tag: tags
  category: categories
  author: authors
  series: series

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, markdown]

pagination:
  pagerSize: 24

imaging:
  anchor: Center
  resampleFilter: CatmullRom

sitemap:
  changefreq: weekly
  filename: sitemap.xml
  priority: 0.5

# No googleAnalytics here on purpose: the upstream site's config carries its own
# GA property, and inheriting it would report this site's traffic to someone else.
services:
  rss:
    limit: 50

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

related:
  threshold: 0
  toLower: false
  includeNewer: true
  indices:
    - { name: tags, weight: 100 }
    - { name: categories, weight: 100 }
    - { name: authors, weight: 20 }
    - { name: date, weight: 10 }

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1

params:
  # -- Identity --------------------------------------------------------------
  logo: images/avatar.jpg
  author: Yongjie Xue
  role: Full Stack & AI Engineer
  location: Austin, Texas
  github_repo: https://github.com/yongjiexue88/yongjiexue88.github.io
  github_project_repo: https://github.com/yongjiexue88
  github_branch: main
  version: ''

  # -- Reading ---------------------------------------------------------------
  page_width: wide
  reading_width: normal
  time_format_blog: 2006-01-02
  time_format_default: 2006-01-02

  # -- Local search ----------------------------------------------------------
  offline_search: true
  offline_search_on_serve: true
  offline_search_index: summary
  offline_search_summary_length: 80
  offline_search_max_results: 12

  # -- Comments --------------------------------------------------------------
  # Left off deliberately. The upstream site wires giscus to its own repository,
  # so inheriting that block would file this site's comments as issues over there.
  comments:
    enable: false

  print:
    toc: true

  # -- Presentation ----------------------------------------------------------
  # The column recipe, from the upstream site: a full-bleed hero drawn from each
  # post's own featured image, a card grid for every index, an in-flow outline
  # rail and no sidebar. Every top-level section here is a blog column, so this
  # is the site default rather than nine identical cascades.
  ui:
    typography: technical
    dark_mode: true
    navbar_autohide: false
    footer_style: fat
    landing_search: true

    featured_image: hero
    blog_index: cards
    blog_index_columns: 3
    blog_index_toggle: true
    blog_index_size: 24
    toc_style: flow
    toc_taxonomies: false
    sidebar_enabled: false
    section_index: cards
    section_index_columns: 3

    reading_time: true
    image_zoom: true
    annotation: true
    lastmod_commit: none
    keyboard_nav: true
    scroll_spy: true
    code_copy: true

    share: [x, telegram, linkedin, reddit, weibo, email, copy]

    taxonomy_icons:
      categories: fa-solid fa-folder
      tags: fa-solid fa-tags
      authors: fa-solid fa-user-pen
      series: fa-solid fa-layer-group

    quick_links: [db, pg]

    page_context_menu:
      enable: true
      assistant_links: true

    feedback:
      enable: false

languages:
  zh-cn:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: 萦怀 · 薛勇杰
    hasCJKLanguage: true
    params:
      description: 薛勇杰的个人博客与主页：以写作者的眼光做工程，记录系统、语言、职业、技术与生活。
      copyright:
        authors: '[薛勇杰](https://yongjiexue88.github.io/) ([@yongjiexue88](https://github.com/yongjiexue88)) · 技术专栏转载自 [vonng.com](https://vonng.com)，依 [CC BY 4.0](https://github.com/Vonng/vonng.com/blob/main/LICENSE) 使用，署名见各文章'
        from_year: 2026
        to_year: present
      footer_center_info: 'Powered by [Hugo](https://gohugo.io) & [OINK](https://oink.pgsty.com)'
      time_format_blog: 2006-01-02
    menus:
      main:
        # Two own columns and the two largest imported ones stand on their own;
        # the rest live under 专栏.
        - { identifier: journal, name: 日志, pageRef: /journal, weight: 10, params: { icon: 'fa-solid fa-feather' } }
