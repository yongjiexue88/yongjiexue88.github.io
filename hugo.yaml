# yongjiexue88.github.io — Hugo site configuration
# Theme: OINK v1.0.0 (github.com/pgsty/oink)

baseURL: https://yongjiexue88.github.io/
title: 萦怀 · Yongjie Xue
defaultContentLanguage: zh-cn
enableRobotsTXT: true

server:
  headers:
    - for: /**
      values:
        Access-Control-Allow-Origin: '*'
enableEmoji: true
enableGitInfo: false
hasCJKLanguage: true
summaryLength: 50
buildDrafts: false
buildFuture: false

taxonomies:
  tag: tags
  category: categories
  author: authors
  series: series

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, markdown]

pagination:
  pagerSize: 20

imaging:
  anchor: Center
  resampleFilter: CatmullRom

sitemap:
  changefreq: weekly
  filename: sitemap.xml
  priority: 0.5

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

related:
  threshold: 0
  toLower: false
  includeNewer: true
  indices:
    - { name: tags, weight: 100 }
    - { name: categories, weight: 100 }
    - { name: authors, weight: 20 }
    - { name: date, weight: 10 }

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1

params:
  # -- Identity --------------------------------------------------------------
  logo: images/avatar.jpg
  author: Yongjie Xue
  role: Full Stack & AI Engineer
  location: Austin, Texas
  github_repo: https://github.com/yongjiexue88/yongjiexue88.github.io
  github_project_repo: https://github.com/yongjiexue88
  github_branch: main
  version: ''

  # -- Reading ---------------------------------------------------------------
  page_width: wide
  reading_width: normal
  time_format_blog: 2006-01-02
  time_format_default: 2006-01-02

  # -- Local search ----------------------------------------------------------
  offline_search: true
  offline_search_on_serve: true
  offline_search_index: summary
  offline_search_summary_length: 80
  offline_search_max_results: 12

  # -- Context & feedback ----------------------------------------------------
  comments:
    enable: false

  page_context_menu:
    enable: true
    assistant_links: false

  feedback:
    enable: false

languages:
  zh-cn:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: 萦怀 · 薛勇杰
    hasCJKLanguage: true
    params:
      description: 薛勇杰的个人博客与主页：以写作者的眼光做工程，记录系统、语言、职业、技术与生活。
      copyright:
        authors: '[薛勇杰](https://yongjiexue88.github.io/) ([@yongjiexue88](https://github.com/yongjiexue88))'
        from_year: 2026
        to_year: present
      footer_center_info: 'Powered by [Hugo](https://gohugo.io) & [OINK](https://oink.pgsty.com)'
      time_format_blog: 2006-01-02
    menus:
      main:
        - { identifier: journal, name: 日志, pageRef: /journal, weight: 10, params: { icon: 'fa-solid fa-feather' } }
        - { identifier: notes, name: 笔记, pageRef: /notes, weight: 20, params: { icon: 'fa-solid fa-book-open' } }
        - { identifier: tags, name: 标签, pageRef: /tags, weight: 30, params: { icon: 'fa-solid fa-tags' } }
        - { identifier: about, name: 关于, pageRef: /about, weight: 40, params: { icon: 'fa-solid fa-circle-user' } }

  en:
    label: English
    locale: en-US
    weight: 2
    title: Yongjie Xue
    params:
      description: Personal blog and notes of Yongjie Xue — Engineering with a writer’s eye.
      copyright:
        authors: '[Yongjie Xue](https://yongjiexue88.github.io/en/) ([@yongjiexue88](https://github.com/yongjiexue88))'
        from_year: 2026
        to_year: present
      footer_center_info: 'Powered by [Hugo](https://gohugo.io) & [OINK](https://oink.pgsty.com)'
      time_format_blog: 2006-01-02
    menus:
      main:
        - { identifier: journal, name: Journal, pageRef: /journal, weight: 10, params: { icon: 'fa-solid fa-feather' } }
        - { identifier: notes, name: Notes, pageRef: /notes, weight: 20, params: { icon: 'fa-solid fa-book-open' } }
        - { identifier: tags, name: Tags, pageRef: /tags, weight: 30, params: { icon: 'fa-solid fa-tags' } }
        - { identifier: about, name: About, pageRef: /about, weight: 40, params: { icon: 'fa-solid fa-circle-user' } }
